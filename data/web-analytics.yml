category:
  slug: web-analytics
  name: Web analytics
  description: >
    Privacy-friendly, EU-hosted site analytics instead of Google Analytics.
  alternative_to:
    - Google Analytics
  updated: 2026-07-06

tools:
  - name: Plausible Analytics
    url: https://plausible.io/
    hq: Tallinn, Estonia
    flag: "🇪🇪"
    license: AGPL-3.0 (open source)
    hosting: both
    data_residency: EU-hosted (servers in Germany); self-host option available.
    free_tier: 30-day trial; free forever if you self-host.
    paid_from: Cloud from $9/mo (10k monthly pageviews).
    best_for: Teams who want a lightweight, cookie-less, GDPR-friendly GA replacement.
    notes: >
      Open source, no cookies, no personal data collection. Script is tiny; runs
      on EU infrastructure or your own server.
    alternative_to:
      - Google Analytics
    sources:
      - url: https://plausible.io/#pricing
        verified: 2026-07-06

  - name: trckl.eu
    url: https://trckl.eu/
    hq: Milan, Italy
    flag: "🇮🇹"
    license: Proprietary
    hosting: cloud
    data_residency: 100% EU-hosted infrastructure; zero raw IP addresses stored on disk and no tracking cookies.
    free_tier: 10 tracked short links/month, QR codes, and EU Bio Page (no credit card required).
    paid_from: Pro from €12/mo (3 custom domains, REST API v1); Agency €39/mo (25 custom domains).
    best_for: European teams and agencies needing GDPR-clean branded short links, Designer QR codes, and an Art. 28 DPA.
    notes: >
      Cookieless link shortener, Designer QR Studio, and EU Bio Page with automatic
      traffic-source attribution and self-serve Art. 28 DPA. Proprietary SaaS (not open source).
    alternative_to:
      - Bitly
      - Rebrandly
    sources:
      - url: https://trckl.eu/
        verified: 2026-11-17
