- pipeline: build-publish
  name: Build & publish eurostack.alternative.to
  refs:
  - refs/heads/main
  actions:
  - action: Build site
    type: BUILD
    commands: ./scripts/build
    docker_image_name: library/node
    docker_image_tag: 20
  - action: Publish site
    type: PUBLISH_ARTIFACT_VERSION
    local_path: dist
    remote_path: /
    input_type: BUILD_ARTIFACTS
    versions:
    - 1.0.0
    artifact: eurostack-alternative-to
