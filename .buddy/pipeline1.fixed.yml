# Buddy pipeline (1/2) — eurostack.alternative.to
# verify-data: runs automatically on every push to the FIXED `main` ref.
# Validates the catalog data (schema, dead links, duplicates). Never publishes —
# this is the quality gate for pull requests. Build & publish is pipeline2.
- pipeline: verify-data
  name: Verify data
  on: EVENT
  refs:
  - refs/heads/main
  events:
  - type: PUSH
    refs:
    - refs/heads/main
  actions:
  - action: Validate catalog data
    type: BUILD
    docker_image_name: library/node
    docker_image_tag: "20"
    execute_commands:
    - ./scripts/verify
