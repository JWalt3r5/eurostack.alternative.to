# Buddy pipeline (1/2) — eurostack.alternative.to
# verify-data: runs automatically on push to `main` AND on pull requests
# targeting `main`. Validates the catalog data (schema, duplicates, links) so a
# PR gets a check before merge. Never publishes — build & publish is pipeline2.
- pipeline: verify-data
  name: Verify data
  on: EVENT
  refs:
  - refs/heads/main
  events:
  - type: PUSH
    refs:
    - refs/heads/main
  - type: PULL_REQUEST
    events:
    - OPENED
    - SYNCHRONIZED
    - REOPENED
    branches:
    - main
  actions:
  - action: Validate catalog data
    type: BUILD
    docker_image_name: library/node
    docker_image_tag: "20"
    execute_commands:
    - ./scripts/verify
